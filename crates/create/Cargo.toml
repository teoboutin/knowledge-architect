[package]
name = "knowledge-architect-create"
readme = "CRATES-IO.md"
description = "Creates a knowledge-architect project and adds a Component to one: the manifest, the installed agent files, and the documents and homes the check requires."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
# What the published package ships, as a whitelist: a new directory is shipped only once it is
# listed here, so the design documents never reach the package.
include = ["/src/**", "/Cargo.toml", "/README.md", "/CRATES-IO.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/CHANGELOG.md"]

[dependencies]
# Edits a hand-written manifest keeping its comments and layout, which `toml` drops when it
# writes a value back: `new-component` appends to `[project] components` with it.
toml_edit = "0.25"
# Quotes a string as the manifest writes one.
toml = "1.1.4"
# Pinned exactly, as every crate of the workspace carries one version, per
# `design@knowledge-architect@version-lockstep`.
knowledge-architect-agent-skills = { path = "../agent-skills", version = "=0.10.0" }
knowledge-architect-check = { path = "../check", version = "=0.10.0" }
knowledge-architect-git = { path = "../git", version = "=0.10.0" }
knowledge-architect-model = { path = "../model", version = "=0.10.0" }

[lints]
workspace = true
