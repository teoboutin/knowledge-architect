[package]
name = "knowledge-architect-model"
readme = "CRATES-IO.md"
description = "What knowledge-architect reads of a project: its manifest, the walk git supplies, the parse of each document, the entity table, and what a reference resolves to."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
# What the published package ships, as a whitelist: a new directory is shipped only once it is
# listed here.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/CHANGELOG.md"]

[dependencies]
# The two parsers. A Rust doc comment's content is markdown, so the markdown parser runs over
# both file kinds and the Rust grammar's job is to say which byte ranges are prose at all.
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
serde = { version = "1", features = ["derive"] }
toml = "1.1.4"
# Every git invocation, per `design@knowledge-architect@checker-asks-git-through-the-crate`.
knowledge-architect-git = { path = "../git", version = "=0.9.0" }

[dev-dependencies]
# The shipped text the tests of `shipped_set` hold to the entity table. By path alone, which cargo
# strips when it packages the crate, so `model` depends on nothing of `agent-skills` for a consumer.
knowledge-architect-agent-skills = { path = "../agent-skills" }
