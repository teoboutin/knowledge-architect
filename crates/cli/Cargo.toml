[package]
name = "knowledge-architect"
readme = "CRATES-IO.md"
description = "The klarch binary and its library: the tools of knowledge-architect as one program, and the API a binary that registers an extension is written against."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
# What the published package ships, as a whitelist: a new directory is shipped only once it is
# listed here, so the test fixtures and the design documents never reach the package.
include = ["/src/**", "/Cargo.toml", "/README.md", "/CRATES-IO.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/CHANGELOG.md"]

# The library is imported as `knowledge_architect`; the binary is `klarch`, short to type, as the
# default command a project runs.
[lib]
path = "src/lib.rs"

[[bin]]
name = "klarch"
path = "src/main.rs"

[dependencies]
# The commands are declared here, so a binary that registers an extension flattens them into its
# own, per `design@cli@the-commands-are-a-library-module`.
clap = { version = "4", features = ["derive"] }
# The checks, the logic of the commands that run them, and what an extension is written against. Pinned exactly, as every crate of
# the workspace carries one version, per `design@knowledge-architect@version-lockstep`.
knowledge-architect-check = { path = "../check", version = "=0.10.0" }
# Each of these is a library the binary links, so its directory and its package name are listed in
# the binary, per `design@check@a-foreign-build-is-refused`.
knowledge-architect-agent-skills = { path = "../agent-skills", version = "=0.10.0" }
knowledge-architect-git = { path = "../git", version = "=0.10.0" }
knowledge-architect-model = { path = "../model", version = "=0.10.0" }
knowledge-architect-create = { path = "../create", version = "=0.10.0" }
knowledge-architect-query = { path = "../query", version = "=0.10.0" }
knowledge-architect-transcript = { path = "../transcript", version = "=0.10.0" }

[dev-dependencies]
# The manifest `init` writes, which its tests parse.
toml = "1.1.4"

[lints]
workspace = true
