# The smallest conformant project for `klarch`, with no extension: it declares no table
# `check` does not own, and it carries every document the root component owes. The `check` binary
# passes over it; a copy that adds a `[rules]` table is refused, because no extension of that
# binary claims it.

[project]
# A mock project inside `check`'s directory, which the binary built here confirms.
checker-version = "fixture"
name = "core-mock"
components = []

[walk]
skip-dirs = []
skip-files = []

# This mock installs nothing. The shipped set changes with every version of the skills, and a
# fixture that held its installed copy would change with them.
[agents]
harness = []
