[package]
name = "knowledge-architect-check"
readme = "CRATES-IO.md"
description = "Checks a project's documents against the rules of its design record: references, registers and generated indexes, and each command's logic behind a typed API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
# What the published package ships, as a whitelist: a new directory is shipped only once it is
# listed here, so the test fixtures and the design documents never reach the package.
include = ["/src/**", "/Cargo.toml", "/README.md", "/CRATES-IO.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/CHANGELOG.md"]

[dependencies]
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
# Reads the session transcripts Claude Code writes as JSON lines, for `transcript`.
serde_json = "1"
toml = "1.1.4"
# Edits a hand-written manifest keeping its comments and layout, which `toml` drops when it
# writes a value back: `new-component` appends to `[project] components` with it.
toml_edit = "0.25"
knowledge-architect-agent-skills = { path = "../agent-skills", version = "=0.9.0" }
# Every git invocation, per `design@knowledge-architect@checker-asks-git-through-the-crate`; pinned exactly, as
# every crate of the workspace carries one version, per `design@knowledge-architect@version-lockstep`.
knowledge-architect-git = { path = "../git", version = "=0.9.0" }
# What phases 1 to 3 read and what they build; pinned exactly, for the same reason.
knowledge-architect-model = { path = "../model", version = "=0.9.0" }
