[package]
name = "knowledge-architect-testing"
readme = "CRATES-IO.md"
description = "What an extension's tests need to run the checker over a mock project, as the binary runs it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
# What the published package ships, as a whitelist: a new directory is shipped only once it is
# listed here, so the test fixtures and the design documents never reach the package.
include = ["/src/**", "/Cargo.toml", "/README.md", "/CRATES-IO.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/CHANGELOG.md"]

[dependencies]
# What the harness re-exports, which holds what it takes of `model`. Pinned exactly, as every crate of the workspace carries one version,
# per `design@knowledge-architect@version-lockstep`.
knowledge-architect-check = { path = "../check", version = "=0.9.0" }

[dev-dependencies]
# What the integrated tests drive. By path alone, so `cargo publish` drops it and this crate's
# place in the publish order owes nothing to `cli`, whose own graph holds nothing of this crate,
# per `design@agent-skills@shared-test-component`.
knowledge-architect = { path = "../cli" }
knowledge-architect-agent-skills = { path = "../agent-skills" }
knowledge-architect-model = { path = "../model" }
# The gates command of the CI workflow a scaffold holds, which `tests/scaffold.rs` parses.
knowledge-architect-gates = { path = "../gates" }
clap = { version = "4", features = ["derive"] }
toml = "1.1.4"
