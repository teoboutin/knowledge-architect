# WHAT THIS MOCK EXERCISES, for `klarch`: conformance. Every built-in check runs over it
# and finds nothing, which is the assertion `planted` cannot make. It carries the directory
# shape of a heading home — `docs/design/` and `docs/goals/`, each headed by a README linking
# its subdocument — the only ISSUE instance in any mock of `check` that declares a group, and every
# generated file committed and current. Plant no defect here: this is the project that shows the
# checks do not report over a tree that is right.

[project]
# A mock project of this repository. A test in process needs no confirmed pin, and a test of the
# binary runs in a copy that carries the version.
checker-version = "fixture"
name = "dirhome"
components = []

[walk]
skip-dirs = []
# No row names a file-register index: the tool derives that set from the register instances,
# so those are outside the walk by construction.
skip-files = []
exclude = []

# This mock installs nothing. The shipped set changes with every version of the skills, and a
# fixture that held its installed copy would change with them.
[agents]
harness = []
