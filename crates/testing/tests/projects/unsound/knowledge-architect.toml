# WHAT THIS MOCK EXERCISES, for `klarch`: the phase gate. It carries one planted defect
# per assertion of the first phases that read the tree — a declared path that is not there, a
# missing heading home, the retired file shape of a file register, a location whose home is
# absent, a file the walk cannot read as text, a heading markdown reads and the checker does not,
# a goals home in the Component `the-widget`, which holds a goal, though the root alone carries
# the register, and the plans layout's: a file outside both homes, misnamed milestones and specs,
# a spec file and a slice file where a plan document is a directory, and a search/ holding other
# than `.txt` files
# — and, behind them, the definition-site defects
# of the entity table: a slug defined twice, one at a level its register does not declare, one
# at the head of a plain line, one in a table cell, one outside every register home, one in the
# middle of a line, a heading at its register's level with no slug, an entry id no reference
# can spell, the slug of that goal, written in a file that is no register home, and a live item
# reusing the id of an item a harvested slice defines. A run over
# it stops at phase 2 and prints those findings; the tests in
# `path@testing@tests/model_over_mocks.rs` reach the phase-3 defects by calling the entity table
# directly. The phase-4 defects, one per check, are `planted`'s, which is
# clean through phase 3 for exactly that reason.

[project]
# A mock project of this repository. A test in process needs no confirmed pin, and a test of the
# binary runs in a copy that carries the version.
checker-version = "fixture"
name = "unsound"
components = ["parts/the-widget"]

# PLANTED: a location whose issue directory is not there. A location carries the registers it
# declares, so the missing home is a finding against the location rather than a silent gap.
[locations.agent-config]
path = "agent-config"
registers = ["issue"]

[walk]
skip-dirs = []
# PLANTED: `notes/gone.md` is not there. A declared path naming a file that does not exist is
# the stale row this check reports — silent otherwise, and inherited by whatever is created there.
skip-files = ["notes/gone.md"]
exclude = []
