# WHAT THIS MOCK EXERCISES, for `klarch`: detection. Its documents are wrong on purpose,
# one planted defect per built-in check of the last phase, the family `agents` apart, and a test asserts the findings
# themselves rather than merely that something failed. Every other built-in check owes a row in
# `PLANTED` in `path@testing@tests/checks_over_mocks.rs`, so a new defect goes here and its count
# goes there.

[project]
# A mock project of this repository. A test in process needs no confirmed pin, and a test of the
# binary runs in a copy that carries the version.
checker-version = "fixture"
name = "planted"
# Two components below the root, carrying every document and every register home; the second
# for the changelog checks.
components = ["parts/widget", "parts/gizmo"]

# A location carrying its issue directory; the one whose directory is not there is planted
# in the `unsound` project.
[locations.agent-config]
path = "agent-config"
registers = ["issue"]

[walk]
# Not a git repository, so there is no `.git` to skip and none is declared.
skip-dirs = []
skip-files = []
exclude = []

# The files under `free/` hold the spans of the citation-free levels, one case per file, each named
# by the level its glob gives it; `free/unmatched.md` is matched by neither glob.
[walk.citation-free]
all = ["free/all-*.md"]
entries = ["free/entries-*.md"]

# This mock installs nothing. The shipped set changes with every version of the skills, and a
# fixture that held its installed copy would change with them.
[agents]
harness = []

# The changelog checks. The root's package publishes nowhere, and the two below it are published, in
# lockstep: each defect of the grammar is planted in parts/widget/CHANGELOG.md, the bump and the
# preamble in parts/gizmo/CHANGELOG.md, and the `include` in parts/gizmo/Cargo.toml.
[changelog]
assembled = "notes/CHANGELOG.md"
assembled-url = "https://example.org/planted/CHANGELOG.md"
categories = ["Migration", "New features", "Workflow"]
unclassed = ["0.1.0"]

[changelog.category-components]
Workflow = ["gizmo"]
