# The smallest conformant project for `klarch`, with no extension: it declares no table
# `check` does not own, and it carries every document the root component owes. `klarch`
# passes over a pinned copy of it; a copy that adds a `[rules]` table is refused, because no extension of that
# binary claims it.

[project]
# A mock project of this repository. A test in process needs no confirmed pin, and a test of the
# binary runs in a copy that carries the version.
checker-version = "fixture"
name = "core-mock"
components = []

[walk]
skip-dirs = []
skip-files = []

# This mock installs nothing. The shipped set changes with every version of the skills, and a
# fixture that held its installed copy would change with them.
[agents]
harness = []
