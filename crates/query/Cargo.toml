[package]
name = "knowledge-architect-query"
readme = "CRATES-IO.md"
description = "Tools that read a project's scanned record and run no check: one entry and what cites it, the standing entries, the anchors, whether an id is free, and the work list of a search."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
# What the published package ships, as a whitelist: a new directory is shipped only once it is
# listed here, so the test fixtures and the design documents never reach the package.
include = ["/src/**", "/Cargo.toml", "/README.md", "/CRATES-IO.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/CHANGELOG.md"]

[dependencies]
# Pinned exactly, as every crate of the workspace carries one version, per
# `design@knowledge-architect@version-lockstep`.
knowledge-architect-git = { path = "../git", version = "=0.10.0" }
knowledge-architect-model = { path = "../model", version = "=0.10.0" }

[lints]
workspace = true
