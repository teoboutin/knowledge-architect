# The merge check for a pull request.
#
# ONE STEP RUNS THE GATES: `cargo x gates`, whose list in tools/xtask/src/gates.rs is the one
# gate list. Why each flag is CI's is `design@xtask@gates-list-primary-home`; the log groups and
# the error annotation are `design@gates@annotations-under-actions`.
#
# The job `gates` runs that step on each system, and the job `check` gathers what the systems
# answered into the one status context that the ruleset on main requires.
#
# The merge procedure it serves is root CLAUDE.md `Git`: a pull request is merged through GitHub
# once `check` passed on its current head, which the ruleset requires up to date with main.
#
name: ci

on:
  pull_request:
    # No `push` trigger: `main` receives the tested tree, the branch being up to date with it,
    # and a push trigger beside this one bills every push to an open pull request twice. None on
    # a branch under way either: that checks a draft's commits, against
    # `design@knowledge-architect@ci-skips-a-draft`; the fields of the pull request this file reads,
    # the draft flag, the number and the head, are empty on a push; and its successful run would be
    # a successful run on the head, which the merge predicate would take for the merge check.
    types: [opened, synchronize, reopened, ready_for_review]

# Read-only: nothing here writes to the repository, comments on the pull request, or
# publishes anything, so the job is given no token that could.
permissions:
  contents: read

# A later push to one pull request cancels the run on the earlier head. A cancelled run
# reports `cancelled`, not `success`, so the merge predicate, which asks for a successful run on
# the current head, never counts it. The key holds the draft flag: a push to a draft, followed at
# once by `gh pr ready`, starts two runs on one head, and GitHub may start the push's run last;
# in a group without the flag, that run, which skips, would cancel the ready run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  gates:
    # The whole list of the project on each system: which gates run on one is for the list to say,
    # and nothing here names a gate.
    strategy:
      # Each system's verdict is reported, whichever fails first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # A draft is not checked, per `design@knowledge-architect@ci-skips-a-draft`. A job skipped by
    # `if:` reports `skipped`, which GitHub counts as passing, so the merge predicate reads the
    # draft flag itself and asks for a successful run, per
    # `design@knowledge-architect@the-merge-waits-for-a-successful-run-on-the-head`.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    # A hung job runs up to the default 360 minutes, so the limit stays explicit.
    timeout-minutes: 30
    # The one shell every runner has; a Windows runner's own default is PowerShell.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          # The branch's head, not the default merge ref: that ref is a synthetic merge
          # commit, which would be the last commit of the range `commits` judges and never lands.
          ref: ${{ github.event.pull_request.head.sha }}
          # FULL DEPTH. The range check resolves origin/main..HEAD and the rebased gate asks
          # whether HEAD contains origin/main; a shallow clone answers neither.
          fetch-depth: 0

      - name: toolchains
        # Named separately so a runner image that cannot provide the toolchain pinned in
        # rust-toolchain.toml fails here, with the missing thing in the step name.
        run: |
          cargo --version
          rustc -vV

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Pinned by commit: a third-party action in a job holding a token. Its default
        # `cache-workspace-crates: false` is load-bearing: the workspace crates, the
        # checker among them, are rebuilt on every run, so a restored binary never carries a
        # stale checker path.

      - name: gates
        # `cargo --locked x`: the `x` alias resolves the workspace before the tool starts, and
        # without cargo's own flag it rewrites a drifted Cargo.lock before any gate sees it.
        run: cargo --locked x gates --locked --fail-fast --require-rebased --full --ci

      - name: gate logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One run refuses two artifacts of one name, so each system's has its own.
          name: gate-logs-${{ matrix.os }}
          path: target/gates/

  check:
    # The context the ruleset requires, so the list of systems changes with no change of a setting.
    # `always()`: without it this job is skipped when the job it needs fails, and GitHub counts a
    # skipped job as passing.
    needs: gates
    if: ${{ !github.event.pull_request.draft && always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: the gates passed on every system
        # `success` alone passes: a matrix that was cancelled or skipped answers neither `success`
        # nor `failure`.
        run: test '${{ needs.gates.result }}' = success
