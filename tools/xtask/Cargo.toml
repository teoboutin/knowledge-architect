[package]
name = "xtask"
description = "Workflow automation: runs multi-command workflows and distills their output."
version.workspace = true
edition.workspace = true
license.workspace = true
# A maintenance tool of this repository, never published.
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# The manifest's file name, so the root finder spells it in one place, the constant this library
# re-exports; and
# the library the setup skill's main, compiled by examples/setup_snippet.rs, is written against.
knowledge-architect = { path = "../../crates/cli" }
# The gates' runner, which this repository publishes for other projects and uses itself.
knowledge-architect-gates = { path = "../../crates/gates" }
# The hand mutation, `cargo x mutate`, which this repository publishes for other projects and uses
# itself.
knowledge-architect-mutate = { path = "../../crates/mutate" }
# What the transcript reader's own files, which `cargo x transcript-kinds` includes, depend on.
regex = "1.13.1"
serde_json = "1"

[dev-dependencies]
# `cargo metadata`'s output, which the checkout test reads for the workspace's targets.
serde_json = "1"
# The cargo configuration, whose `[env]` entry the checkout test reads.
toml = "1"

[lints]
workspace = true
